# T-5243: compila el APK de Android (TWA con Bubblewrap) de la app ALIA.
# - A mano: Actions → «APK Android» → Run workflow. Con un tag app-v* (p. ej. app-v1.0.1) también publica un Release.
# - La llave de firma NUNCA está en el repo: llega por secretos (ver docs/APP-MOVIL.md).
# - versionCode = número de corrida, para que cada APK nuevo se instale encima del anterior.
name: APK Android

on:
  workflow_dispatch:
  push:
    tags: ['app-v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Revisar secretos
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASS KEY_PASS; do
            if [ -z "${!name}" ]; then echo "::error::Falta un secreto de firma (ver docs/APP-MOVIL.md)"; exit 1; fi
          done

      - name: Llave de firma (solo en esta máquina)
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # Copiado desde Windows trae \r, saltos o espacios: se limpian antes de decodificar.
          if ! printf '%s' "$KEYSTORE" | tr -d '\r\n\t ' | base64 --decode > android.keystore; then
            echo "::error::ANDROID_KEYSTORE_BASE64 no es base64 válido: vuelve a copiarlo (docs/APP-MOVIL.md, paso 2)"; exit 1
          fi
          if ! keytool -list -keystore android.keystore -alias alia -storepass "$STORE_PASS" > /dev/null; then
            echo "::error::La llave no abre con ANDROID_KEYSTORE_PASSWORD (o no tiene el alias «alia»)"; exit 1
          fi
          echo "Llave y contraseña OK"

      - name: Versión
        run: |
          name="${GITHUB_REF_NAME#app-v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || name="1.0.${GITHUB_RUN_NUMBER}"
          jq --arg name "$name" --argjson code "$GITHUB_RUN_NUMBER" '.appVersionName = $name | .appVersionCode = $code' twa-manifest.json > tmp.json
          mv tmp.json twa-manifest.json
          echo "Versión $name ($GITHUB_RUN_NUMBER)"

      - name: Bubblewrap
        run: |
          npm install -g @bubblewrap/cli@1
          # El runner trae el SDK en ANDROID_HOME (ANDROID_SDK_ROOT puede venir vacío). Bubblewrap exige la carpeta
          # «tools» del SDK viejo, que ya no viene: se enlaza a cmdline-tools/latest (mismo sdkmanager).
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "SDK: $SDK"; ls "$SDK"
          [ -e "$SDK/tools" ] || sudo ln -s "$SDK/cmdline-tools/latest" "$SDK/tools"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$SDK\"}" > ~/.bubblewrap/config.json
          cat ~/.bubblewrap/config.json

      - name: Generar proyecto y compilar
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest=./twa-manifest.json
          mkdir -p dist
          cp app-release-signed.apk "dist/alia-${GITHUB_RUN_NUMBER}.apk"
          [ -f app-release-bundle.aab ] && cp app-release-bundle.aab "dist/alia-${GITHUB_RUN_NUMBER}.aab" || true

      - name: Huella del certificado (para ANDROID_CERT_SHA256 en Vercel)
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -list -v -keystore android.keystore -alias alia -storepass "$STORE_PASS" | grep 'SHA256:' | sed 's/.*SHA256: /ANDROID_CERT_SHA256=/' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: alia-apk
          path: android/dist/*
          if-no-files-found: error

      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "App ALIA $GITHUB_REF_NAME" --notes "APK de Android. Instalar: docs/APP-MOVIL.md"

      - name: Borrar la llave
        if: always()
        run: rm -f android.keystore
